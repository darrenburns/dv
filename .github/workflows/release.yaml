name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: goreleaser
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Checkout local Terma dependency
        uses: actions/checkout@v4
        with:
          repository: darrenburns/terma
          ref: ad4d7cd2de162b98a133bd0e727af279ae9ba254
          path: .deps/terma
      - run: ln -s "$GITHUB_WORKSPACE/.deps/terma" ../terma
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
